# implements [FR-CICD](https://github.com/korchasa/flowai/blob/main/documents/requirements.md#fr-cicd-cicd-pipeline-security)
# implements [FR-CICD.SPLIT](https://github.com/korchasa/flowai/blob/main/documents/requirements.md#fr-cicd-cicd-pipeline-security)
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.7.11

      - name: Verify file integrity after setup
        run: |
          git diff --exit-code || { echo "::error::Unexpected file modifications after setup"; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard)" ] || { echo "::error::Unexpected untracked files after setup"; exit 1; }

      - name: Run checks
        run: deno task check

      - name: Verify file integrity after checks
        run: |
          git diff --exit-code || { echo "::error::Unexpected file modifications after checks"; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard --exclude=src/bundled.json --exclude=src/_version.ts)" ] || { echo "::error::Unexpected untracked files after checks"; exit 1; }

  publish:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.7.11

      - name: Bundle framework
        run: deno task bundle

      - name: Pre-flight bundle sanity
        run: |
          test -s src/bundled.json || { echo "::error::src/bundled.json missing or empty after bundle"; exit 1; }
          test -s src/_version.ts || { echo "::error::src/_version.ts missing or empty after bundle"; exit 1; }

      - name: Publish to JSR
        run: deno publish --allow-dirty

      - name: Verify install
        run: |
          deno install --global -A -n flowai-installed jsr:@korchasa/flowai
          flowai-installed --version
